<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Startpoint | Diagnóstico — Etapa 4</title>
    <meta name="description" content="Escolha uma área de interesse para personalizar sua trilha na Startpoint.">
</head>

<body>
    <header>
        <a href="login.html">startpoint</a>
        <p>Etapa 4 de 4</p>
    </header>

    <div class="progress">
        <div class="progress-fill--quatro"></div>
    </div>

    <main>
        <p>04</p>

        <h1>Qual área combina com você?</h1>
        <p>Você poderá mudar esta escolha depois.</p>

        <form action="#" method="post">
            <div>
                <label for="administrativo">Administrativo</label>
                <input
                    type="radio"
                    name="area"
                    id="administrativo"
                    value="administrativo"
                    required
                >
            </div>

            <div>
                <label for="tecnologia">Tecnologia</label>
                <input
                    type="radio"
                    name="area"
                    id="tecnologia"
                    value="tecnologia"
                >
            </div>

            <div>
                <label for="varejo">Varejo</label>
                <input
                    type="radio"
                    name="area"
                    id="varejo"
                    value="varejo"
                >
            </div>

            <div>
                <label for="logistica">Logística</label>
                <input
                    type="radio"
                    name="area"
                    id="logistica"
                    value="logistica"
                >
            </div>

            <div>
                <label for="atendimento-cliente">Atendimento ao Cliente</label>
                <input
                    type="radio"
                    name="area"
                    id="atendimento-cliente"
                    value="atendimento_cliente"
                >
            </div>

            <div>
                <label for="servicos-financeiros">Serviços Financeiros</label>
                <input
                    type="radio"
                    name="area"
                    id="servicos-financeiros"
                    value="servicos_financeiros"
                >
            </div>

            <div>
                <label for="saude">Saúde</label>
                <input
                    type="radio"
                    name="area"
                    id="saude"
                    value="saude"
                >
            </div>

            <div>
                <label for="industria">Indústria</label>
                <input
                    type="radio"
                    name="area"
                    id="industria"
                    value="industria"
                >
            </div>

            <a href="diagnostico-3.html">Voltar</a>
            <a href="inicio.html">Gerar minha trilha →</a>
        </form>
    </main>
</body>
</html>
