<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Startpoint | Diagnóstico — Etapa 3</title>
    <meta name="description" content="Escolha sua cidade ou região para encontrar cursos e vagas perto de você.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="diagnostico.css">
</head>

<body>
    <header>
        <a href="login.html">startpoint</a>
        <p>Etapa 3 de 4</p>
    </header>

    <div class="progress">
         <div class="progress-fill--tres"></div>
    </div>
    
    <main>
        <p>03</p>

        <h1>Onde você está?</h1>
        <p>Vamos priorizar cursos e vagas perto de você.</p>

        <form action="#" method="post">
            <div>
                <!-- Barra de busca -->
                <label for="regiao">Cidade ou região</label>
                <input
                    type="text"
                    id="regiao"
                    name="regiao"
                    list="regioes"
                    placeholder="Digite sua cidade"
                    required
                >

                <datalist id="regioes">
                    <option value="São Paulo/SP"></option>
                    <option value="Campinas/SP"></option>
                    <option value="Osasco/SP"></option>
                    <option value="Guarulhos/SP"></option>
                    <option value="Santo André/SP"></option>
                    <option value="São Bernardo do Campo/SP"></option>
                    <option value="Diadema/SP"></option>
                    <option value="Barueri/SP"></option>
                    <option value="Mogi das Cruzes/SP"></option>
                    <option value="Sorocaba/SP"></option>
                </datalist>
            </div>

            <a href="diagnostico-2.html">Voltar</a>
            <a href="diagnostico-4.html">Continuar →</a>
        </form>
    </main>
</body>
</html>
