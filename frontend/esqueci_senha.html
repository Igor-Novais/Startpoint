<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Startpoint | Recuperar senha</title>
    <meta name="description" content="Recupere o acesso à sua conta Startpoint.">
</head>

<body>
    <header>
        <a href="login.html">startpoint</a>
        <button type="button" aria-label="Alterar tema">☾</button>
    </header>

    <main>
        <section aria-labelledby="titulo-recuperacao">
            <p>SEU PRIMEIRO PASSO</p>

            <h1 id="titulo-recuperacao">Esqueceu a senha?</h1>
            <p>
                Informe o e-mail cadastrado para receber as instruções
                de recuperação de senha.
            </p>

            <form action="#" method="post">
                <div>
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit">Enviar →</button>
            </form>

            <a href="login.html">Voltar para o login</a>
        </section>
    </main>
</body>
</html>
