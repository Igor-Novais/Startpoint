<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Startpoint | Criar conta</title>
    <meta name="description" content="Crie sua conta na Startpoint.">
</head>
<body>
    <header>
        <a href="login.html">startpoint</a>
	    <button type="button">Alterar tema</button>
    </header>

    <main>

       <p>SEU PRIMEIRO PASSO</p>
        <h1>Crie sua conta.</h1>
        <p>Você está começando sua jornada para conquistar a primeira oportunidade.</p>

        <form action="#" method="post">
            <div>
                <label for="name">Nome completo</label>
                <input
                    type="text"
                    id="name"
                    name="nome"
                    placeholder="Como você quer ser chamado?"
                    required>
            </div>

             <div>
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="voce@email.com"
                    required>
            </div>

            <div>
                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    name="senha"
                    placeholder="Crie uma senha"
                    required>
            </div>

            <div>
                <label for="confirmar-senha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    placeholder="Digite a senha novamente"
                    required>
            </div>

                 <button type="submit">Criar conta →</button>
  
        </form>

        <a href="login.html">Já tenho uma conta</a>  
    </main>
</body>
</html>
