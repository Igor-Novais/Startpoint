<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Startpoint | Diagnóstico — Etapa 2</title>
    <meta name="description" content="Conte o que você já aprendeu para personalizar sua trilha na Startpoint.">
</head>

<body>
    <header>
        <a href="login.html">startpoint</a>
        <p>Etapa 2 de 4</p>
    </header>

    <main>
        <p>02</p>

        <h1>O que você já aprendeu?</h1>
        <p>Pode marcar mais de uma opção.</p>

        <form action="#" method="post">
            <div>
                <label for="informatica-basica">Informática básica</label>
                <input
                    type="checkbox"
                    name="aprendidos"
                    id="informatica-basica"
                    value="informatica_basica"
                    checked
                >
            </div>

            <div>
                <label for="pacote-office">Pacote Office</label>
                <input
                    type="checkbox"
                    name="aprendidos"
                    id="pacote-office"
                    value="pacote_office"
                >
            </div>

            <div>
                <label for="atendimento-cliente">Atendimento ao cliente</label>
                <input
                    type="checkbox"
                    name="aprendidos"
                    id="atendimento-cliente"
                    value="atendimento_cliente"
                >
            </div>

            <div>
                <label for="nenhum-ainda">Nenhum ainda</label>
                <input
                    type="checkbox"
                    name="aprendidos"
                    id="nenhum-ainda"
                    value="nenhum_ainda"
                >
            </div>

            <a href="diagnostico-1.html">Voltar</a>
            <a href="diagnostico-3.html">Continuar →</a>
